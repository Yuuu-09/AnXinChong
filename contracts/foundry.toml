[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../node_modules"]
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.37"
evm_version = "osaka"
network = "monad"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_limit = 100000000

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 64
depth = 50
fail_on_revert = true

[profile.ci.invariant]
runs = 256
depth = 100
fail_on_revert = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
